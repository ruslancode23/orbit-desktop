name: Check

# The shell has to compile on both desktop targets, and only one of them can be built on a
# developer's machine: Windows is here and nowhere else (desktop-tasks.md, «Принято»).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # The spike probe is plain JS that only runs inside a WebView; a syntax error there
      # would surface as a silent missing report on someone's machine.
      - run: node --check src-tauri/spike/probe.js
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml
