[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Desktop shell for Orbit: a Tauri window on the web app's own origin"
authors = ["Orbit"]
edition = "2021"
rust-version = "1.82"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DESK-3: the web app reaches these through PlatformAdapter only.
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
# DESK-6: the push-to-talk key is heard while another application is focused.
tauri-plugin-global-shortcut = "2"
# DESK-5: one window per launch, the window comes back from the tray, size and place are kept.
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
