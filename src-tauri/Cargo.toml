[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Desktop shell for Orbit: a Tauri window on the web app's own origin"
authors = ["Orbit"]
edition = "2021"
rust-version = "1.82"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
